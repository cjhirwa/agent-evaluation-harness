[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-harness"
version = "0.1.0"
description = "An open benchmark for tool-using LLM agents: sandboxed tasks, deterministic checks, and scoring for success, cost, steps and failure type."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
report = ["matplotlib>=3.7"]
dev = ["pytest>=8"]
all = ["openai>=1.40", "matplotlib>=3.7", "pytest>=8"]

[project.scripts]
aeh = "aeh.cli:main"

[tool.setuptools.packages.find]
include = ["aeh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
